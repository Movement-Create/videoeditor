# Infrastructure only. Does not start the editor or publish it on the internet.
# Use a distinct project name for each instance. Never use `down -v` on real data.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: videoeditor
      POSTGRES_USER: videoeditor
      POSTGRES_PASSWORD: ${KIMU_POSTGRES_PASSWORD:?Set KIMU_POSTGRES_PASSWORD in your external secrets file}
    ports:
      - "127.0.0.1:${KIMU_POSTGRES_PORT:-15432}:5432"
    volumes:
      # Postgres 18 stores versioned data beneath /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoeditor -d videoeditor"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${KIMU_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
